!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Banking Utility</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Banking Utility</h1>

    <!-- Account Holder -->
    <label for="name">Account Holder:</label>
    <input type="text" id="name">

    <br><br>

    <!-- Initial Balance -->
    <label for="balance">Initial Balance:</label>
    <input type="number" id="balance">

    <br><br>

    <!-- Deposit Amount -->
    <label for="deposit">Deposit Amount:</label>
    <input type="number" id="deposit">

    <br><br>

    <!-- Withdrawal Amount -->
    <label for="withdrawal">Withdrawal Amount:</label>
    <input type="number" id="withdrawal">

    <br><br>

    <!-- Start Banking Operation -->
    <button onclick="startBanking()">Start</button>

    <br><br>

    <!-- JavaScript Output -->
    <div id="result"></div>

    <!-- External JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
